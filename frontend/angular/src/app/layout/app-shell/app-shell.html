<div class="app-shell">
  <a href="#main-content" class="skip-link">{{ 'shell.skipToMainContent' | translate }}</a>

  <app-header
    [isDrawerOpen]="isDrawerOpen()"
    [session]="playerSession.state()"
    (toggleDrawer)="toggleDrawer()"
    (logoutRequested)="logout()"
  />

  <div class="app-shell__body">
    <!-- Mobile Drawer Modal Overlay & Surface -->
    @if (isDrawerOpen()) {
      <div
        class="app-shell__backdrop"
        (click)="closeDrawer()"
        aria-hidden="true"
      ></div>
      <div
        id="mobile-drawer"
        class="app-shell__drawer"
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="'shell.drawerAriaLabel' | translate"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
      >
        <app-sidebar [isMobileDrawer]="true" (closeRequested)="closeDrawer()" />
      </div>
    }

    <main id="main-content" class="app-shell__main" tabindex="-1">
      <router-outlet />
    </main>
  </div>

  <app-footer />
</div>
