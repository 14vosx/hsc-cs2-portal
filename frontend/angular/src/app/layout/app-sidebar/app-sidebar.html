<div class="app-sidebar" [class.app-sidebar--mobile]="isMobileDrawer()">
  @if (isMobileDrawer()) {
    <div class="app-sidebar__header">
      <span class="app-sidebar__title">Navegação</span>
      <button
        type="button"
        class="app-sidebar__close-btn"
        aria-label="Fechar menu de navegação"
        (click)="onClose()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  }

  <div class="app-sidebar__content">
    <app-primary-nav (itemSelected)="onClose()" />
  </div>
</div>
