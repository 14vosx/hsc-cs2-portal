<header class="app-header" role="banner">
  <div class="app-header__container">
    <div class="app-header__brand">
      <a routerLink="/" class="app-header__logo-link" aria-label="HSC CS2 Portal - Página inicial">
        <span class="app-header__badge">HSC</span>
        <span class="app-header__title">CS2 PORTAL</span>
      </a>
    </div>

    <!-- Mobile Navigation Drawer Toggle Button -->
    <button
      type="button"
      class="app-header__toggle"
      [attr.aria-expanded]="isDrawerOpen()"
      aria-controls="mobile-drawer"
      [attr.aria-label]="isDrawerOpen() ? 'Fechar menu de navegação' : 'Abrir menu de navegação'"
      (click)="onToggle()"
    >
      <svg
        class="app-header__toggle-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </div>
</header>
