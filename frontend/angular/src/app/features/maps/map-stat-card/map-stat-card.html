<article
  class="map-stat-card"
  [class.map-stat-card--highlight]="highlight()"
  [style.--map-bg]="mapBackgroundImage()"
>
  <header class="map-stat-card__header">
    <div class="map-stat-card__title-wrap">
      <span class="map-stat-card__label">Mapa</span>
      <strong class="map-stat-card__name">{{ map().name }}</strong>
    </div>
  </header>

  <dl class="map-stat-card__stats">
    <div class="map-stat-card__stat">
      <dt>Partidas</dt>
      <dd>{{ map().matches }}</dd>
    </div>
    <div class="map-stat-card__stat">
      <dt>Rounds</dt>
      <dd>{{ map().rounds }}</dd>
    </div>
    <div class="map-stat-card__stat">
      <dt>Média de rounds</dt>
      <dd>{{ formatAvg(map().averageRoundsPerMatch) }}</dd>
    </div>
    <div class="map-stat-card__stat">
      <dt>Último jogo</dt>
      <dd>{{ formatDate(map().lastPlayedAt) }}</dd>
    </div>
  </dl>

  <footer class="map-stat-card__footer">
    <a class="map-stat-card__details-link" [routerLink]="['/maps', map().name]">
      Ver detalhe →
    </a>
  </footer>
</article>
