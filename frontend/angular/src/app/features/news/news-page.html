<section class="news-page">
  @if (vm$ | async; as vm) {
    <app-page-header
      eyebrow="News HSC"
      title="Últimas notícias do clube"
      description="Comunicados, bastidores e atualizações da comunidade CS2 HSC."
    >
      @if (vm.state === 'ready') {
        <div meta>
          <app-status-badge
            [label]="publicationCountLabel(vm.count)"
            tone="info"
          />
        </div>
      }
    </app-page-header>

    @switch (vm.state) {
      @case ('loading') {
        <app-page-state
          type="loading"
          title="Carregando notícias..."
          message="Sincronizando as publicações editoriais do HSC."
        />
      }

      @case ('error') {
        <app-page-state
          type="error"
          title="News indisponível"
          message="Não foi possível carregar as publicações neste momento."
          actionLabel="Tentar novamente"
          (actionClick)="retry()"
        />
      }

      @case ('empty') {
        <app-page-state
          type="empty"
          title="Nenhuma notícia publicada"
          message="As próximas mensagens do clube aparecerão por aqui."
        />
      }

      @case ('ready') {
        <section class="news-page__feed" aria-label="Últimas publicações">
          <app-section-header
            eyebrow="Editorial"
            title="Últimas publicações"
            description="Notícias e comunicados oficiais na ordem publicada pelo clube."
          />

          <div class="news-page__grid">
            @for (item of vm.items; track item.slug) {
              <app-news-card [item]="item" />
            }
          </div>
        </section>
      }
    }
  }
</section>
