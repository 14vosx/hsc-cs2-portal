<article class="news-card">
  <a
    class="news-card__link"
    [routerLink]="['/news', item().slug]"
    [attr.aria-label]="'newsCard.accessibility.read' | translate: { title: item().title }"
  >
    <div class="news-card__media">
      @if (showImage()) {
        <img
          [src]="item().imageUrl!"
          [alt]="item().title"
          loading="lazy"
          decoding="async"
          (error)="onImageError()"
        />
      } @else {
        <div class="news-card__media-fallback" aria-hidden="true">
          <span>HSC</span>
          <small>{{ 'newsCard.fallback.mediaLabel' | translate }}</small>
        </div>
      }
      <span class="news-card__media-index" aria-hidden="true">HSC // NEWS</span>
    </div>

    <div class="news-card__body">
      <time
        class="news-card__date"
        [attr.datetime]="item().publishedAt"
      >
        {{ formatDate(item().publishedAt) || ('newsCard.fallback.date' | translate) }}
      </time>

      <h2 class="news-card__title">
        {{ item().title }}
      </h2>

      @if (hasExcerpt()) {
        <p class="news-card__excerpt">
          {{ item().excerpt }}
        </p>
      }

      <span class="news-card__cta">
        {{ 'newsCard.readMore' | translate }}
        <span aria-hidden="true">→</span>
      </span>
    </div>
  </a>
</article>
