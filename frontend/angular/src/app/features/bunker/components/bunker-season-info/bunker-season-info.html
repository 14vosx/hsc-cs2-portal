<div class="bunker-season-info">
  <div class="bunker-season-info__header">
    <span class="bunker-season-info__eyebrow">A temporada atual</span>
    <h2 class="bunker-season-info__title">{{ seasonTitle() }}</h2>
  </div>

  <div class="bunker-season-info__meta">
    <div class="bunker-season-info__period">
      <span class="bunker-season-info__label">Período:</span>
      <span class="bunker-season-info__value">{{ periodText() }}</span>
    </div>

    <div class="bunker-season-info__status">
      <span class="bunker-season-info__label">Status:</span>
      <app-status-badge [label]="statusBadgeInfo().label" [tone]="statusBadgeInfo().tone" />
    </div>

    <div class="bunker-season-info__updated">
      <span class="bunker-season-info__label">Atualizado em:</span>
      <span class="bunker-season-info__value">{{ generatedAtText() }}</span>
    </div>
  </div>
</div>
