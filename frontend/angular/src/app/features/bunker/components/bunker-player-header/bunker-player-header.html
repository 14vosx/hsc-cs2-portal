<header class="bunker-player-header">
  <div class="bunker-player-header__main">
    <div class="bunker-player-header__avatar-wrapper">
      @if (showAvatar()) {
        <img
          class="bunker-player-header__avatar-img"
          [src]="avatarUrl()"
          [alt]="'Avatar Steam de ' + playerName()"
          (error)="onAvatarError()"
        />
      } @else {
        <div
          class="bunker-player-header__avatar-fallback"
          [attr.aria-label]="'Monograma de ' + playerName()"
        >
          {{ monogram() }}
        </div>
      }
      <span class="bunker-player-header__status-dot" aria-hidden="true"></span>
    </div>

    <div class="bunker-player-header__info">
      <span class="bunker-player-header__eyebrow">Bunker HSC</span>
      <h1 class="bunker-player-header__name">{{ playerName() }}</h1>
      <div class="bunker-player-header__meta">
        @if (steamId64()) {
          <span class="bunker-player-header__steam-id">SteamID {{ steamId64() }}</span>
        }
        @if (steamProfileUrl()) {
          <a
            class="bunker-player-header__steam-link"
            [href]="steamProfileUrl()"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="'Ver perfil Steam de ' + playerName()"
          >
            Ver perfil Steam
          </a>
        }
      </div>
    </div>
  </div>

  <div class="bunker-player-header__badges">
    <app-status-badge label="Sessão conectada" tone="success" />
    <app-status-badge [label]="historyAvailabilityLabel()" [tone]="historyAvailabilityTone()" />
  </div>

  <div class="bunker-player-header__actions">
    <button
      type="button"
      class="bunker-player-header__logout-btn"
      [disabled]="logoutPending()"
      (click)="onLogout()"
    >
      {{ logoutPending() ? 'Saindo...' : 'Sair' }}
    </button>
  </div>

  @if (logoutFailed()) {
    <div class="bunker-player-header__error-wrapper">
      <p class="bunker-player-header__error-msg" role="alert">
        Não foi possível encerrar a sessão. Tente novamente.
      </p>
    </div>
  }
</header>
