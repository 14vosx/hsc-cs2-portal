<app-ui-card>
  <div class="bunker-auth-card">
    <span class="bunker-auth-card__eyebrow">{{ 'bunker.auth.eyebrow' | translate }}</span>
    <h2 class="bunker-auth-card__title">{{ 'bunker.auth.title' | translate }}</h2>
    <p class="bunker-auth-card__description">
      {{ 'bunker.auth.description' | translate }}
    </p>
    <a class="bunker-auth-card__cta" [href]="steamLoginUrl()">{{ 'bunker.auth.action' | translate }}</a>
  </div>
</app-ui-card>
