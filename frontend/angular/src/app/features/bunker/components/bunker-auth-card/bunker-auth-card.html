<app-ui-card>
  <div class="bunker-auth-card">
    <span class="bunker-auth-card__eyebrow">Conta Steam</span>
    <h2 class="bunker-auth-card__title">Entre para acessar o Bunker</h2>
    <p class="bunker-auth-card__description">
      Entre com Steam para validar sua sessão de jogador e carregar seu resumo competitivo quando disponível.
    </p>
    <a class="bunker-auth-card__cta" [href]="steamLoginUrl()">Entrar com Steam</a>
  </div>
</app-ui-card>
