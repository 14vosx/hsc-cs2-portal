<div
  class="bunker-section-nav"
  role="tablist"
  [attr.aria-label]="'bunker.navigation.ariaLabel' | translate"
>
  @for (tab of tabs; track tab.id; let index = $index) {
    <button
      #tabButton
      class="bunker-section-nav__tab"
      type="button"
      role="tab"
      [id]="'bunker-tab-' + tab.id"
      [attr.aria-controls]="'bunker-panel-' + tab.id"
      [attr.aria-selected]="activeTab() === tab.id"
      [tabIndex]="activeTab() === tab.id ? 0 : -1"
      (click)="selectTab(tab.id)"
      (keydown)="handleKeydown($event, index)"
    >
      {{ tab.labelKey | translate }}
    </button>
  }
</div>
